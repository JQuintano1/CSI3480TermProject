<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insecure Login with Check</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 300px;
      text-align: center;
    }
    h2 {
      color: #388e3c;
    }
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .input-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #c8e6c9;
      border-radius: 5px;
    }
    button {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #388e3c;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Insecure Login</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required />
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <script>
      // Start here - Simulating user database just for test
      const users = [
        { username: "user1", password: "pass123" },
        { username: "user2", password: "password5" },
        { username: "admin", password: "admin123" }
      ];
      // ends here

      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const inputUsername = document.getElementById("username").value;
        const inputPassword = document.getElementById("password").value;

        const found = users.some(user => user.username === inputUsername && user.password === inputPassword);

        if (found) {
          alert("You have successfully logged in!");
        } else {
          alert("Login failed. Invalid username or password.");
        }
      });
    </script>
  </div>
</body>
</html>
